.clinic-hero{padding:58px 0 27px;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:38px}.clinic-hero h1{font-size:clamp(2.4rem,5vw,4.7rem)}.clinic-hero .lead{color:#becfd9;font-size:1.08rem;max-width:680px}.clinic-billboard{background:linear-gradient(145deg,#183b43,#112435 72%);border:1px solid #43616b;border-radius:22px;padding:27px;box-shadow:var(--shadow)}.clinic-pill{display:inline-flex;padding:5px 10px;border:1px solid #6b705b;background:#3b422d;color:#ffdb8c;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;font-weight:900}.clinic-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:17px 0}.clinic-metrics>div{background:#0b2532;border-radius:11px;padding:15px}.clinic-metrics strong{display:block;font-size:1.45rem;color:var(--gold);font-family:var(--head)}.clinic-metrics span{font-size:.71rem;color:#bfced5}.clinic-note{border-left:3px solid var(--mint);padding-left:12px;font-size:.79rem;color:#b6cbd0}.case-layout{display:grid;grid-template-columns:286px minmax(0,1fr);gap:24px;margin-top:26px;align-items:start}.case-sidebar{position:sticky;top:94px;max-height:calc(100vh - 115px);overflow:auto;border:1px solid var(--border);border-radius:16px;background:#102536;padding:16px}.case-sidebar .case-navbtn{width:100%;text-align:left;background:transparent;color:#d2e0e6;border:1px solid transparent;border-radius:11px;padding:11px 13px;display:block;margin:4px 0}.case-sidebar .case-navbtn:hover,.case-sidebar .case-navbtn.active{background:#244654;border-color:#48727a}.case-navbtn .smalltag{display:block;color:var(--gold);font-size:.68rem;letter-spacing:.12em;font-weight:900}.case-navbtn .subtag{display:block;font-size:.73rem;color:#9fb5bf}.case-panel{background:#122738;border:1px solid var(--border);border-radius:18px;padding:29px;min-width:0}.case-head{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:start}.case-head h2{font-size:clamp(1.7rem,2.7vw,2.65rem);margin-top:11px}.case-intro{font-size:.93rem;color:#c4d6dd;max-width:850px}.case-prog-track{margin:14px 0;background:#294453;border-radius:20px;height:8px;overflow:hidden}.case-prog-track div{height:100%;background:linear-gradient(90deg,#7ce0c6,#e9bf67);transition:width .25s}.case-actionrow{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.case-actionrow button{border:1px solid #567584;border-radius:9px;background:#163b47;color:#d7eef0;padding:9px 13px;font-weight:800;font-size:.79rem}.case-actionrow button:hover{border-color:var(--gold)}.case-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.case-actions button{padding:9px 12px;font-weight:800;border:1px solid #587380;color:#d7edf0;background:#173442;border-radius:9px}.case-actions button.primary{color:#17283b;background:var(--gold);border-color:var(--gold)}.case-actions button:disabled{opacity:.4;cursor:not-allowed}.case-badge{display:inline-flex;color:var(--mint);font-size:.69rem;letter-spacing:.12em;font-weight:900;text-transform:uppercase}.case-section{padding:20px 0;border-bottom:1px solid var(--border)}.case-section:last-child{border-bottom:0}.case-section h3{margin-bottom:10px}.case-section p{color:#c5d3d9}.case-outcomes{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.case-outcomes li{border:1px solid #3d6069;border-radius:12px;background:#112e3b;padding:13px;font-size:.84rem;color:#d6e5e8}.case-outcomes li:before{content:'✓';color:var(--mint);font-weight:900;margin-right:6px}.case-document-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.case-docbtn{border:1px solid #405a6a;border-radius:10px;background:#0f2536;color:#dceef0;padding:11px;text-align:left}.case-docbtn strong{font-size:.82rem}.case-docbtn small{display:block;color:#9eb2be}.case-docbtn[aria-pressed=true]{border-color:var(--gold);background:#2f3d35}.case-docbody{background:#071b27;border:1px solid #375865;border-radius:11px;padding:20px;margin-top:12px;color:#d4e5e9;white-space:pre-wrap;line-height:1.7;font-size:.86rem;overflow-wrap:anywhere}.source-row{display:flex;flex-wrap:wrap;gap:8px}.source-row a{border:1px solid #426278;background:#0e2b3d;padding:8px 12px;border-radius:9px;font-size:.79rem}.motion-board{padding:17px;background:radial-gradient(circle at 84% 5%,#28595a,transparent 47%),#071c2c;border:1px solid #3e7171;border-radius:16px;overflow:hidden}.motion-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:19px 0 13px}.motion-node{position:relative;border:1px solid #416a72;border-radius:12px;background:#142d40;padding:17px 9px;text-align:center;color:#a9c3cd;font-size:.77rem;font-weight:800;min-height:91px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.motion-node:after{content:'›';position:absolute;right:-13px;color:var(--gold);font-size:24px;z-index:2}.motion-node:last-child:after{display:none}.motion-node em{font-style:normal;color:#b3d8d8;font-size:.69rem}.motion-node.active{background:#3f5845;border-color:var(--gold);color:white;box-shadow:0 0 0 3px #e9bf671e}.motion-node.active:before{content:'';position:absolute;inset:-2px;border:2px solid var(--gold);border-radius:12px;animation:casePulse 1.5s ease-in-out infinite alternate}.motion-node.complete{background:#174840;border-color:#80bea6}.motion-description{font-size:.83rem;color:#bbd6d7;min-height:38px}.motion-controller{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.motion-controller button{background:var(--gold);border:0;border-radius:9px;padding:7px 11px;font-weight:900;color:#132a34}.stage-tabbar{display:flex;flex-wrap:wrap;gap:7px;margin:19px 0}.stage-tabbar button{flex:1;min-width:140px;border:1px solid #42616e;border-radius:10px;padding:9px;background:#153246;color:#aec6ce;font-weight:700;font-size:.76rem}.stage-tabbar button.active{background:var(--gold);color:#162531;border-color:var(--gold)}.stage-tabbar button.done:not(.active){border-color:#79c5a7}.stage-objective{border-left:3px solid var(--gold);padding:12px 16px;background:#1b3440;color:#e7e0c8;margin:14px 0;border-radius:0 10px 10px 0}.case-choice{display:block;border:1px solid #3d5e6b;border-radius:11px;padding:13px 15px;margin:9px 0;color:#d7e7ea;background:#112e3e;cursor:pointer}.case-choice:hover{border-color:#80d7bf}.case-choice input{margin-right:9px;accent-color:var(--gold)}.case-choice.chosen{border-color:var(--gold);background:#293b3c}.case-feedback{background:#153a36;border:1px solid #508877;border-radius:12px;padding:14px;margin:14px 0;color:#d2f1e8;font-size:.87rem}.case-feedback.risk{border-color:#a9824a;background:#45382c;color:#ffe7be}.case-write{display:block;width:100%;min-height:158px;background:#091d2c;border:1px solid #4b6d7a;border-radius:11px;padding:15px;color:white;line-height:1.7;resize:vertical;margin:12px 0 5px}.case-wordcount{font-size:.72rem;color:#9db8c5}.case-checks{list-style:none;padding:0;margin:13px 0;display:grid;gap:8px}.case-checks li{padding:9px 11px;border-left:2px solid var(--mint);background:#173c44;font-size:.82rem;color:#d3e7e8}.case-model{background:#1d382d;border:1px solid #527f5f;border-radius:12px;padding:16px;margin:12px 0;color:#dbe9dc}.case-coach{background:#1a3848;border:1px solid #3c7a87;border-radius:12px;padding:14px;margin:12px 0;font-size:.86rem;color:#cde5ed}.case-source-warning{font-size:.77rem;color:#b1cad3;margin-top:10px}.case-report{font-size:.85rem;background:#0b2535;padding:15px;border-radius:11px;border:1px solid #3e6070;margin:15px 0}.case-tutor-send{display:flex;gap:8px;flex-wrap:wrap}.case-tutor-send textarea{flex:1;min-width:210px;min-height:58px;background:#0b2030;border:1px solid #466472;border-radius:10px;padding:10px 12px;color:white}.case-tutor-send button{border:1px solid var(--gold);background:var(--gold);color:#172a38;border-radius:10px;padding:8px 13px;font-weight:900}.case-tutor-answer{white-space:pre-wrap;line-height:1.65;overflow-wrap:anywhere;font-size:.85rem;color:#c9e7e5;padding:13px;margin-top:12px;background:#0b2734;border-radius:10px}.clinic-footer{padding:30px 0;color:#aac0c8;font-size:.79rem}.case-info{background:#1f3440;border-left:3px solid var(--mint);padding:13px 16px;border-radius:0 10px 10px 0;font-size:.85rem;color:#e0e5e8}.case-status{color:#d6e4e6;font-size:.77rem}.case-matter-summary{font-size:.82rem;color:#c2d6dc}.case-summarygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.case-summarygrid>div{background:#0c2938;border:1px solid #3e6870;border-radius:11px;padding:13px}.case-summarygrid strong{font-size:1.45rem;color:var(--gold);display:block}.case-summarygrid span{color:#b8cbd3;font-size:.76rem}@keyframes casePulse{from{opacity:.3}to{opacity:1}}@media(max-width:1000px){.clinic-hero{grid-template-columns:1fr}.case-layout{grid-template-columns:230px minmax(0,1fr)}.case-outcomes{grid-template-columns:1fr}}@media(max-width:760px){.clinic-hero{padding-top:35px}.case-layout{grid-template-columns:1fr}.case-sidebar{position:static;display:grid;grid-template-columns:repeat(2,1fr);gap:5px;max-height:none}.case-sidebar h3,.case-sidebar .case-sidebar-top{grid-column:span 2}.case-panel{padding:17px}.motion-flow{gap:7px}.motion-node{font-size:.66rem;padding:13px 5px;min-height:88px}.case-document-row{grid-template-columns:1fr}.case-outcomes{gap:7px}.stage-tabbar button{min-width:110px}.clinic-metrics>div{padding:10px}.clinic-metrics strong{font-size:1.2rem}}@media(max-width:400px){.case-sidebar{grid-template-columns:1fr}.case-sidebar h3,.case-sidebar .case-sidebar-top{grid-column:span 1}.motion-node em{display:none}}@media(prefers-reduced-motion:reduce){.motion-node.active:before{animation:none}}@media print{.case-sidebar,.case-actions,.motion-board,.stage-tabbar,.case-tutor-send,.top-nav,.app-header,.case-document-row,.case-source-warning,.case-coach button,.no-print{display:none!important}.case-layout{display:block}.case-panel{background:#fff;border:0;color:#000}.case-panel p,.case-panel h2,.case-section h3,.c <script>
window.LEGAL_CLINIC = {"updated":"12 November 2026","description":"Supplemental independent case-based learning; all scenarios and artefacts are fictional except separately linked official sources.","matters":[{"id":"false-authority","number":"01","title":"The Phantom Authority","tag":"LEGAL RESEARCH + PROFESSIONAL ETHICS","jurisdiction":"England & Wales","time":"105–135 min","module":"ai-law","video":"HTASafUWg8A","videoTitle":"CodeX FutureLaw: Beyond Efficiency (external)","desc":"A supervising solicitor receives a polished, AI-assisted skeleton argument containing one plausible but invented authority. Trace and correct it without disclosing client information.","brief":"Scenario (entirely fictional except the real official sources cited separately): A junior researcher has drafted a procedural argument for a commercial hearing. The draft looks professional, but the source ledger is incomplete. You have 45 minutes before the internal filing review—not a court deadline—to decide what to escalate.","outcomes":["Prove a citation exists rather than relying on fluency","Check relevance, jurisdiction and procedural posture","Protect confidential material and create a human sign-off trail"],"exhibits":[{"title":"EX-01 · Internal research request","type":"Fictional message","body":"From: Senior associate\nSubject: Quality assurance before filing\nPlease verify every reported authority and passage, confirm that each proposition is actually supported, and flag anything that cannot be checked from an authorised source. Use synthetic facts for this training exercise. I will approve the final content."},{"title":"EX-02 · Draft passage","type":"Fictional training document — NOT a legal authority","body":"The draft states: “In Brightwell Trading Ltd v Norchester Council [2024] EWHC 9999 (Comm), the High Court held that digital evidence is automatically conclusive unless challenged within 24 hours.”\n\nWARNING: Brightwell Trading Ltd v Norchester Council is an INVENTED training citation. The claimed legal rule is also an invented teaching statement. Neither may be used as law."},{"title":"EX-03 · Evidence and audit log","type":"Fictional system extract","body":"Model output: probable citation; confidence 98%.\nSearch links: none supplied.\nVerified judgment PDF: not attached.\nVerified paragraph number: absent.\nReviewer sign-off: pending.\nPrompt log: contains an unsanitised client filename (do not copy into a public tool)."},{"title":"EX-04 · Authoritative reading","type":"Real source reference","body":"The SRA warning notice on misuse of AI (17 August 2026) emphasises competence, effective supervision, verified authorities and client confidentiality. The reported Ayinde / Al-Haroun judgment [2025] EWHC 1383 (Admin) is available from the judiciary website. Read originals; this case study does not reproduce or reinterpret the judgment."}],"sources":[["SRA warning: misuse of AI","https://www.sra.org.uk/solicitors/guidance/misuse-ai"],["Courts and Tribunals Judiciary: Ayinde / Al-Haroun","https://www.judiciary.uk/judgments/ayinde-v-london-borough-of-haringey-and-al-haroun-v-qatar-national-bank/"],["ABA Formal Opinion 512 (US comparator)","https://www.americanbar.org/content/dam/aba/administrative/professional_responsibility/ethics-opinions/aba-formal-opinion-512.pdf"]],"phases":[{"title":"Triage the draft","objective":"Decide what can safely progress","prompt":"What is the first defensible action?","options":["Submit the argument; the model reports 98% confidence","Hold the citation and verify against an authoritative source","Ask a second model whether the citation is real"],"good":1,"why":"An asserted confidence score is not evidence of a judgment. Stop and locate the primary authority before using the proposition.","coach":"Separate citation existence, quotation accuracy, legal relevance and current treatment; these are four different checks.","standard":"The invented citation must be removed or quarantined. Record that no primary source supports it, then search genuine authorities under appropriate supervision.","writing":"Write a 100–150 word internal triage email identifying the invented item, filing risk and next action.","checklist":["Do not submit unverified propositions","Identify the source provenance gap","Name the human approver"]},{"title":"Validate a legal proposition","objective":"Distinguish a real citation from a supported legal proposition","prompt":"You locate a real case with a similar topic. Is that enough?","options":["Yes; any real case proves the proposition","No; read the judgment and check the relevant passage, jurisdiction, date and context","Use only the first paragraph of an online summary"],"good":1,"why":"Real existence is necessary but insufficient: the judgment must actually support the proposition in the relevant jurisdiction and factual context.","coach":"Record court, date, neutral citation, relevant paragraph, holding, subsequent treatment and application to the present facts.","standard":"Use a source ledger with direct official link, paragraph pinpoint, exact supported proposition, limitations and reviewing lawyer. If no authority supports the claim, do not present it as settled law.","writing":"Create a citation verification table in prose: source | official URL | exact proposition | pinpoint | relevance | unknowns.","checklist":["Check existence and exact proposition","Consider negative or distinguishing treatment","Use primary sources where available"]},{"title":"Protect privileged material","objective":"Apply confidentiality controls before using AI tooling","prompt":"The researcher wants to paste a complete client email into a public chatbot. What do you advise?","options":["Paste it: the model terms must protect it","Stop; use only approved tools and data-handling arrangements, and consider a non-AI route","Remove only the client name and assume the rest is safe"],"good":1,"why":"Confidentiality and privacy need a documented, tool-specific evaluation. Removing a name does not necessarily de-identify a document.","coach":"Consider access controls, retention, model training terms, cross-matter leakage, privilege, minimisation, and authorised purpose.","standard":"Escalate the proposed disclosure to the firm’s responsible professional/data governance function; use synthetic material for this exercise.","writing":"Write a data-handling risk note with purpose, information category, proposed tool, threat, control and go/no-go decision.","checklist":["Classify the information","Check whether the tool is approved","Provide a safer workflow"]},{"title":"Sign-off and reflection","objective":"Create a defensible supervision record","prompt":"Who should authorise the final legal submission?","options":["The model because it generated the text","Any colleague who can open the document","A properly responsible legal professional after independent checking"],"good":2,"why":"AI does not replace a lawyer’s professional accountability. Review evidence, correct errors, escalate uncertainty and record who authorised release.","coach":"The audit trail should show what changed, source checks, reviewer, time and unresolved issues without placing confidential contents into the training platform.","standard":"A safe handoff includes a corrected draft, source ledger, rejected-citation log, confidentiality review and explicit human approval.","writing":"Produce a concise sign-off checklist and a reflection on how the failure arose and could be prevented.","checklist":["Explicit reviewer and decision","Traceable changes","No invented authority remains"]}]},{"id":"contract-intake","number":"02","title":"The £45,000 Intake Failure","tag":"AUTOMATION + LEGAL OPERATIONS","jurisdiction":"England & Wales (fictional policy)","time":"100–130 min","module":"automation","video":"QUKLTse6x3E","videoTitle":"Practical Applications for AI in Law Firms (external)","desc":"An intake workflow accidentally treats blank contract values as zero and skips both a conflict check and senior approval. Redesign the service and calculate its economics.","brief":"Scenario: Beacon Harbour Foundation (fictional) has a contract team serving 18 internal projects. Its documented internal policy—created only for this simulation—requires an explicit amount, a cleared conflict check and senior review for contracts worth £25,000 or more. These are not external legal thresholds.","outcomes":["Map a robust workflow with exception handling","Catch missing values and conflicts before automated drafting","Calculate gross contribution without confusing it with profit"],"exhibits":[{"title":"EX-01 · Draft intake form","type":"Fictional input","body":"Counterparty: Calder Systems Ltd (fictional)\nContract description: regional equipment service\nContract value: [blank]\nText in attached schedule: “Estimated total consideration £45,000.”\nConflicts field: unreviewed\nIntake status: new"},{"title":"EX-02 · Defective automation rule","type":"Fictional pseudocode","body":"amount = Number(form.value || 0)\nif (amount < 25000) route(\"standard\")\nelse route(\"senior\")\n\nProblem: missing values become 0; nothing checks conflicts or the contract schedule."},{"title":"EX-03 · Internal control policy","type":"Fictional internal policy, not law","body":"1. Reject any request with a missing explicit value.\n2. Independently check counterparty conflicts before legal drafting.\n3. Any value ≥ £25,000 requires designated senior approval.\n4. Record every override, reviewer and reason.\n5. Stop if the attached schedule conflicts with form data."},{"title":"EX-04 · Cost baseline","type":"Fictional operational data","body":"Proposed fixed price to internal unit: £1,150\nAnalyst work: 6 hours × £85\nSenior check: 2 hours × £170\nOther direct costs: £95\nExpected rework reserve: £110\nOverheads and tax: NOT included."}],"sources":[["CLOC Core 12 competencies","https://cloc.org/what-is-legal-operations/"],["SRA professional responsibilities (AI use)","https://www.sra.org.uk/solicitors/guidance/misuse-ai"],["NIST AI RMF core","https://airc.nist.gov/airmf-resources/airmf/5-sec-core/"]],"phases":[{"title":"Diagnose the exception","objective":"Find why a blank value passed","prompt":"What is the safest behaviour when amount is missing?","options":["Convert it to zero for faster processing","Reject the request as incomplete and ask for a verified amount","Infer £45,000 without noting a discrepancy"],"good":1,"why":"Missing data must not silently become a value. The £45,000 schedule can initiate verification, not bypass the intake approval step.","coach":"Define a required numeric field, error state, document reconciliation and audit event.","standard":"Use explicit validation for null/blank/NaN, reconcile schedule and form, and route unresolved inconsistencies to a person.","writing":"Rewrite the decision rule in plain-language pseudocode with a missing-value branch.","checklist":["Reject incomplete input","Compare the schedule and declared value","Log a human resolution"]},{"title":"Handle the conflict","objective":"Ensure a conflict alert blocks routine progression","prompt":"The internal conflicts search shows a possible counterparty match. What now?","options":["Auto-clear the match because the name differs by one letter","Pause work and route to the authorised conflict reviewer","Proceed and ask the client later"],"good":1,"why":"A possible conflict requires an appropriate human review before substantive processing, according to the fictional internal policy and applicable professional duties.","coach":"Design separate status values: new, incomplete, conflict review, senior review, approved and rejected.","standard":"A safe workflow must be able to stop, preserve evidence and resume only after traceable authorisation.","writing":"Draw or describe an end-to-end swimlane with the submitter, conflicts reviewer, senior approver and operations analyst.","checklist":["Human conflict decision","No silent override","Clear status/owner transitions"]},{"title":"Model unit economics","objective":"Calculate direct contribution and set a viable price","prompt":"Using the provided numbers, what is the expected direct contribution before overhead?","options":["£300, after ignoring senior review","£205, ignoring the rework reserve","£95 direct contribution (1,150 − 510 − 340 − 95 − 110)"],"good":2,"why":"£1,150 − (6×£85 + 2×£170 + £95 + £110) = £95. This is contribution before overhead and is not profit.","coach":"Assess sensitivity: a further 90-minute senior review would add £255 in direct cost and make contribution negative.","standard":"Provide a calculation, scenarios and decision on scope. Do not imply that service price can justify reducing review safeguards.","writing":"Calculate contribution and a 1.5-hour senior-rework sensitivity. Propose an explicit exception fee or scope condition subject to approval.","checklist":["Show full arithmetic","Include rework and supervision","Distinguish contribution from net profit"]},{"title":"Specify acceptance tests","objective":"Prove the redesigned rule handles failures","prompt":"Which test set best validates the pipeline?","options":["Only a clean £10,000 contract","Missing value, conflicting schedule, possible conflict, £24,999 and £25,000 threshold, and override review","Three contracts above £25,000 only"],"good":1,"why":"Boundary and negative tests reveal the failure conditions missed by happy-path demonstrations.","coach":"Use pass/fail assertions, expected owner and required audit fields.","standard":"A credible release gate records test input, expected path, actual path, defect severity, fix and independent approval.","writing":"Create six synthetic tests with expected routing and a stop/release criterion.","checklist":["Boundary tests on both sides of £25,000","Missing and conflicting data","Verified reviewer and audit trail"]}]},{"id":"cross-border-dispute","number":"03","title":"A Refund Across Borders","tag":"ONLINE DISPUTE RESOLUTION + ACCESS","jurisdiction":"Cross-border; laws to be researched","time":"110–140 min","module":"disputes","video":"HTASafUWg8A","videoTitle":"CodeX FutureLaw: Beyond Efficiency (external)","desc":"A consumer and trader disagree about a damaged delivery, different languages and an arbitration clause. Build a fair, accessible ODR journey.","brief":"Scenario: fictional buyer Naya lives in State A; fictional merchant Cedar Lane Devices operates in State B. Naya bought a tablet for £420 equivalent. The package arrived late and damaged. Their chosen languages differ. The marketplace suggests binding online arbitration in its terms, but the clause and relevant law have not yet been assessed.","outcomes":["Preserve documentary evidence without changing originals","Design meaningful consent and language access","Map out voluntary negotiation, neutral mediation and court/tribunal fallback"],"exhibits":[{"title":"EX-01 · Order timeline","type":"Synthetic records","body":"03 April: £420 equivalent payment processed.\n08 April: promised delivery window ended.\n12 April: parcel delivered.\n13 April: buyer photographs a broken screen.\n14 April: marketplace support supplies automated rejection."},{"title":"EX-02 · Conflicting statements","type":"Fictional correspondence","body":"Buyer: “The parcel appeared damaged when I opened it. I want a refund and a human to help in my language.”\nSeller: “The unit was in working condition before shipping. We can offer partial credit if shipping is excluded.”"},{"title":"EX-03 · Platform clause","type":"Fictional contract excerpt, not legally assessed","body":"“Disputes may be submitted to the Marketplace Online Resolution Centre. Resolution may be binding if the user confirms arbitration.” The language, agreement, consumer protections, applicable law and seat are NOT established in this training problem."},{"title":"EX-04 · Accessibility report","type":"Synthetic user test","body":"User cannot upload PDFs on a low-bandwidth phone. The portal is available in only one of the parties’ languages. A keyboard user cannot reach the “request human help” button. The auto-dismiss timer is 60 seconds."}],"sources":[["UNCITRAL ODR technical notes (non-binding)","https://uncitral.un.org/en/texts/onlinedispute/explanatorytexts/technical_notes"],["UNCITRAL ODR overview","https://uncitral.un.org/en/texts/onlinedispute"],["World Justice Project (research)","https://worldjusticeproject.org/"]],"phases":[{"title":"Preserve evidence","objective":"Establish a reliable chronology","prompt":"What should the learner do with the original buyer photograph?","options":["Edit it to make the damage clearer, then discard the original","Keep the original and record the collection date, source and any edits to a separate working copy","Ask the model to invent missing delivery metadata"],"good":1,"why":"Preserve originals and provenance. Do not infer missing metadata. A suitable evidence plan distinguishes source, collection, copying and verification.","coach":"Collect order confirmation, payment, dispatch messages, seller response and image history; record missing materials.","standard":"An evidence register should capture item ID, claimed origin, source person/system, date obtained, integrity steps, disputed facts and access restrictions.","writing":"Write an evidence log with six entries and state what you cannot yet verify.","checklist":["Unaltered source preserved","Disputed assertions separated","Access-controlled evidence log"]},{"title":"Provide fair access","objective":"Design a process the parties can actually use","prompt":"Which interface change is most important?","options":["Make uploaded documents mandatory and shorten the timer","Add language access, low-bandwidth alternatives, keyboard access and a human fallback","Hide help until a settlement is accepted"],"good":1,"why":"An ODR workflow is not fair or effective if participants cannot understand or use it.","coach":"Consider plain language, translation limitations, informed choice, disabilities and the digital divide.","standard":"Offer translated/plain-language notices, assisted upload methods, accessible controls, no coercive timer and an alternative channel.","writing":"Draft a five-step accessible process for both parties with consent and opt-out points.","checklist":["Real language and accessibility routes","No forced settlement","Clear human escalation"]},{"title":"Clarify resolution options","objective":"Avoid asserting an untested arbitration clause is enforceable","prompt":"How should the system present the platform arbitration term?","options":["State that arbitration is automatically mandatory everywhere","Flag the clause for jurisdiction-specific legal review and explain negotiation, mediation and possible formal remedies without pre-judging enforceability","Ignore it and state a specific small-claims deadline"],"good":1,"why":"Enforceability depends on governing law, consumer protections, agreement and facts. The training system cannot resolve that automatically.","coach":"The UNCITRAL technical notes are descriptive and non-binding; they do not themselves determine arbitration rights.","standard":"Give neutral descriptions, identify questions for qualified local review, and preserve access to an appropriate formal process when available.","writing":"Prepare a 120-word neutral options notice; do not invent a deadline, forum, right or remedy.","checklist":["Jurisdiction identified as open","Non-binding UNCITRAL notes correctly framed","No invented deadlines"]},{"title":"Test the journey","objective":"Choose meaningful metrics and failure cases","prompt":"Which outcome should the pilot prioritise?","options":["Settlement rate alone, no matter how reached","Comprehension, informed choice, fairness, completion, escalation access and resolution quality","Maximum automated rejections per hour"],"good":1,"why":"Efficiency is useful but does not override informed participation, fairness or meaningful remedy.","coach":"Include low-connectivity, disability, language and non-settlement scenarios in testing.","standard":"Track time and cost alongside user comprehension, complaint/appeal access, resolution satisfaction, human handoff and unresolved cases.","writing":"Design 8 synthetic ODR usability tests, including at least 3 failure or vulnerability scenarios.","checklist":["At least three accessibility/fairness failures","Human escalation measured","Ethically interpretable indicators"]}]},{"id":"creative-rights","number":"04","title":"Who Owns the AI Campaign?","tag":"COPYRIGHT + LICENSING + CONTRACTS","jurisdiction":"UK / EU / US comparison","time":"105–135 min","module":"copyright","video":"enjfkUuy4QY","videoTitle":"Pamela Samuelson: Generative AI & Copyright (external)","desc":"A marketing agency offers an exclusive global IP assignment in a campaign assembled with AI outputs, licensed images and substantive human edits.","brief":"Scenario: fictional agency Vista & Ink creates visual assets for a product launch. The client requires an exclusive, worldwide assignment and an infringement warranty. Staff used a generative image service, a stock photograph, a third-party font and hand-drawn vector edits. The licence records are incomplete.","outcomes":["Separate ownership/copyrightability from infringement and contract rights","Create a rights provenance and permission inventory","Draft realistic qualified client communications without inventing warranties"],"exhibits":[{"title":"EX-01 · Creation log","type":"Synthetic internal notes","body":"AI prompt: campaign concept and background pattern (generated).\nDesigner: original vector illustration, layout and selective redrawing (documented).\nStock photo: downloaded, licence tier unknown.\nFont: installed by a contractor, licence unknown.\nA reference image resembling a competitor campaign was uploaded into the workflow."},{"title":"EX-02 · Client request","type":"Fictional email","body":"“Please confirm that we own every element exclusively in all territories, that no third-party rights were used, and that every output is infringement-free.”"},{"title":"EX-03 · Draft warranty","type":"Fictional draft contract","body":"Agency warrants without limitation that: (i) it exclusively owns every component, (ii) no AI-generated elements are present, and (iii) no third-party permissions are necessary. This wording conflicts with the training facts."},{"title":"EX-04 · Evidence gaps","type":"Fictional checklist","body":"No records of stock licence; no font EULA; no source files establishing which elements humans authored; no similarity review; AI provider terms not documented."}],"sources":[["US Copyright Office AI initiatives","https://www.copyright.gov/ai/"],["European Commission AI Act resources","https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai"],["UK Intellectual Property Office copyright guidance","https://www.gov.uk/topic/intellectual-property/copyright"]],"phases":[{"title":"Map rights by component","objective":"Identify ownership assumptions before offering exclusivity","prompt":"Can the agency promise ownership of every component from the creation log?","options":["Yes, because the agency paid an AI subscription","No; separate human-authored material, generated outputs and third-party licences","Yes, because all elements appear in the final file"],"good":1,"why":"Different assets may have different rights, licences and jurisdiction-dependent protection. A subscription alone proves neither authorship nor exclusive title.","coach":"Distinguish authorship, rights assignment, tool terms, licence scope, moral rights and infringement.","standard":"Create a component-by-component matrix showing provenance, creator, evidence, permission, assignment chain and unresolved issues.","writing":"Write a 5-row chain-of-title inventory for each campaign asset.","checklist":["Human contributions are documented","Third-party licences identified","No unsupported global title claim"]},{"title":"Assess reference-image risk","objective":"Spot possible substantial similarity and input licensing issues","prompt":"A designer asks to generate a near-copy of the competitor reference. What is the first step?","options":["Proceed because AI outputs never infringe","Pause, check reference-image use permissions and commission independent design with a similarity review","Use the reference as input and delete the prompt history"],"good":1,"why":"Input provenance, output similarity and contractual licence conditions require separate consideration.","coach":"Identify source, rightsholder, permitted uses, transformation, substantial similarity risk and alternative design path.","standard":"Use independently created reference directions and document originality. Escalate unresolved questions to an appropriately qualified IP adviser.","writing":"Draft a clearance note for the reference image and a practical redesign plan.","checklist":["Input licences reviewed","Similarity risk assessed","Evidence retained"]},{"title":"Negotiate the warranty","objective":"Communicate scope without falsely promising absolute certainty","prompt":"Which clause approach is defensible for review by counsel?","options":["Keep the absolute warranty even though it is knowingly inaccurate","Disclose provenance and propose rights-qualified representations, exclusions and a clearance plan","Claim every AI output belongs automatically to the client"],"good":1,"why":"The agency should not warrant facts contradicted by its own creation record. Specific wording requires jurisdiction- and contract-specific legal review.","coach":"Explain where exclusive rights are possible, where licences rather than ownership apply, and which risks need allocation.","standard":"A revised draft identifies owned/assigned components, licensed components, third-party exclusions, approved tools, review standards and liabilities for negotiation.","writing":"Write a client email explaining the limitations and a proposed pre-launch clearance checklist.","checklist":["Do not misrepresent source materials","Separate assignment from licence","Counsel reviews actual clauses"]},{"title":"Prepare release decision","objective":"Make a conditional go/no-go decision","prompt":"Two critical licences are still missing on launch day. What do you recommend?","options":["Launch, because missing evidence is not evidence of a problem","Hold affected assets, substitute cleared alternatives or obtain proper licences and sign-off","Delete the creation log"],"good":1,"why":"The right response is risk-based and evidence-led; unverified rights should not be misrepresented as cleared.","coach":"Plan a rights risk register, fallback artwork and owner/deadline for each issue.","standard":"A decision record flags missing documents, affected deliverables, substitute options, clearance owner and conditional launch gate.","writing":"Produce an IP release memo: confirmed rights, open items, action owner, risk and recommendation.","checklist":["Clear component inventory","Decision based on evidence","Conditional approval and fallback"]}]},{"id":"eu-recruitment","number":"05","title":"The Recruitment Scoring Engine","tag":"EU AI ACT + PRIVACY + FAIRNESS","jurisdiction":"EU AI Act; national law must be checked","time":"110–145 min","module":"eu-ai-act","video":"0jA4biabn1Y","videoTitle":"European Parliament AI content explainer (external)","desc":"An employer proposes to screen candidates automatically. Determine the initial regulatory questions, meaningful human review and a fair test plan.","brief":"Scenario: fictional EU employer Nordlake Services intends to use vendor “MatchSpring” to rank applicants for customer support roles and reject everyone below a score of 60. The model was trained on historical hiring decisions. There are no real applicants or real hiring decisions in this exercise.","outcomes":["Identify relevant Annex III scoping questions","Distinguish provider and deployer roles","Design meaningful reviewer intervention and protected-data controls"],"exhibits":[{"title":"EX-01 · Vendor description","type":"Synthetic sales document","body":"“MatchSpring recommends candidates from 0–100 by learning patterns from past successful hires. HR may accept default bulk rejection of any score below 60. No reason codes are shown to rejected candidates.”"},{"title":"EX-02 · Synthetic evaluation dataset","type":"Invented applicant examples","body":"Applicant A: score 88; relevant experience 4 years\nApplicant B: score 59; relevant experience 6 years\nApplicant C: score 62; relevant experience 1 year\nApplicant D: score 47; relevant experience 5 years\nThese examples do not contain protected traits and cannot establish fairness or model accuracy."},{"title":"EX-03 · Internal governance draft","type":"Fictional policy gap","body":"No records of training-data provenance, score calibration, reasons, human override, accessible appeal, data protection impact assessment or staff training. Recruitment managers are told to trust scores."},{"title":"EX-04 · Regulatory timing note","type":"Real source summary; verify live","body":"As at 12 November 2026, the European Commission timeline indicates Annex III high-risk rules apply from 2 December 2027 and Annex I product rules from 2 August 2028. Other obligations already apply. Dates alone do not determine whether a use is in scope."}],"sources":[["EU AI Act Service Desk implementation timeline","https://ai-act-service-desk.ec.europa.eu/en/ai-act/eu-ai-act-implementation-timeline"],["Consolidated EU AI Act Article 113","https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-113?full=1"],["NIST AI RMF (voluntary)","https://airc.nist.gov/airmf-resources/airmf/5-sec-core/"],["ICO: individual rights and AI systems (UK comparator)","https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/artificial-intelligence/guidance-on-ai-and-data-protection/how-do-we-ensure-individual-rights-in-our-ai-systems"]],"phases":[{"title":"Frame the intended use","objective":"Determine whether the system merits Annex III analysis","prompt":"Which initial assessment is sound?","options":["All AI in recruitment is automatically prohibited","Recruitment screening may fall under Annex III; review the precise intended purpose, actor roles, any exemptions and applicable law","No laws apply until 2028"],"good":1,"why":"Employment, worker management and access to self-employment are sensitive Annex III categories, but actual classification requires the factual and legal tests.","coach":"Separate model features, intended use, deployer/provider role, jurisdiction, persons affected and transition rules.","standard":"Document a provisional high-risk scoping assessment and seek qualified EU/local regulatory review. Do not treat the simulation as a definitive legal opinion.","writing":"Prepare a 200-word scoping note and a list of missing information before classification.","checklist":["Intended purpose explicit","Roles and jurisdictions identified","Regulatory status not overclaimed"]},{"title":"Challenge the 60-point threshold","objective":"Test the human role and discrimination risk","prompt":"HR plans to reject every score below 60 without explanation. What is the best next action?","options":["Deploy the rule immediately","Pause deployment pending legal/data protection review, representative testing, meaningful human review and an effective challenge route","Increase the threshold to 75 without testing"],"good":1,"why":"An unexplained rule with potentially consequential outcomes calls for careful governance, evidence and a meaningful ability to challenge.","coach":"Review legal basis, transparency, fairness, data minimisation, errors, contestability and whether human oversight is genuine.","standard":"A qualified reviewer must be empowered to change the decision, use relevant evidence and document reasons; a rubber-stamp is not meaningful oversight.","writing":"Design a human-review protocol with override rights, escalation and notification.","checklist":["Real human authority, not rubber-stamp","Independent test evidence","Contestability and alternatives"]},{"title":"Interpret a tiny dataset","objective":"Avoid false confidence from synthetic examples","prompt":"What can you safely conclude from four synthetic scores?","options":["The model is 99% fair and accurate","Nothing reliable about real-world accuracy or group fairness; design a representative evaluation","Applicant B must lawfully be rejected"],"good":1,"why":"Four synthetic rows cannot support model performance, protected-group fairness or legal conclusions.","coach":"Define test sets, ground truth, error costs, disaggregation where lawful, drift, documentation and privacy.","standard":"Evaluate false negatives, affected groups, generalisation, calibration and appeals with representative lawful data, with specialist oversight.","writing":"Specify a pre-deployment evidence plan with at least five metrics or checks and limits for each.","checklist":["No invented statistical certainty","Error/harm metrics","Document lawful fairness evaluation"]},{"title":"Prepare a governance gate","objective":"Create a release checklist tied to current law","prompt":"Should the pilot proceed merely because the Annex III start date is in the future?","options":["Yes; the system is unrestricted until then","No; assess already applicable law, privacy obligations, procurement, other AI Act provisions and a staged compliance roadmap","Yes, provided the vendor indemnifies everything"],"good":1,"why":"Application dates vary by provision; other existing legal and professional obligations remain relevant.","coach":"Record official timelines as of the check date and assign responsibility to revalidate them.","standard":"A controlled programme documents legal scoping, data governance, procurement evidence, testing, training, human oversight, incident response and a compliance review date.","writing":"Write a launch/hold recommendation with owners, evidence gaps and the next legal review date.","checklist":["Current law checked from official source","Go/no-go gate","Recheck timeline and local law"]}]},{"id":"community-clinic","number":"06","title":"Design a Community Justice Tool","tag":"LEGAL OPS + PRODUCT DESIGN + HACKATHON","jurisdiction":"Fictional local advice charity","time":"120–180 min","module":"pre-hackathon","video":"0oeD2Wf25wY","videoTitle":"NIST AI risk tutorial (external)","desc":"A community advice centre faces a backlog. Use data and service design to decide whether AI is even the right solution—and build a 48-hour hackathon proposal.","brief":"Scenario: fictional Eastfield Community Advice Centre receives 300 enquiries per month, 30% have missing essential information, and median first response is nine calendar days. A donor has offered funding for a chatbot, but most callers say the website’s instructions are confusing.","outcomes":["Define a measurable user problem without prescribing a tool","Compare non-AI improvements against an AI intervention","Construct a tested prototype with risk and accessibility gates"],"exhibits":[{"title":"EX-01 · Synthetic baseline","type":"Fictional operations dashboard","body":"Monthly enquiries: 300\nIncomplete intake packs: 90 (30%)\nMedian first response: 9 days\nUsers completing intake on first attempt: 45%\nPhone-first users: 38%\nUnresolved complaints about unclear instructions: 17/month"},{"title":"EX-02 · Stakeholder interview snippets","type":"Fictional anonymised training quotations","body":"Volunteer: “I spend 25 minutes explaining the same four questions.”\nService user: “I have a basic phone and mobile data is expensive.”\nSupervisor: “I need to know when an automated system might misroute a time-sensitive matter.”\nDonor: “We want a visible AI element.”"},{"title":"EX-03 · First prototype","type":"Fictional screen specification","body":"The existing form asks 22 questions before explaining what it does. It requires an email address for every user, offers no saved draft, and displays a definitive “You are eligible” message generated by an LLM without a human review."},{"title":"EX-04 · Risk constraints","type":"Fictional project charter","body":"Use only synthetic data for training and demos. No individual legal advice; direct time-sensitive or emergency issues to human staff. Do not infer legal eligibility. Provide a non-digital route. Release only after supervisor approval and 10 synthetic tests."}],"sources":[["NIST AI RMF Govern–Map–Measure–Manage","https://airc.nist.gov/airmf-resources/airmf/5-sec-core/"],["Stanford Center on the Legal Profession","https://law.stanford.edu/center-on-the-legal-profession/"],["UNCITRAL ODR principles (comparative)","https://uncitral.un.org/en/texts/onlinedispute"]],"phases":[{"title":"Find the root cause","objective":"Distinguish user need from a predetermined technology solution","prompt":"What should the team do first?","options":["Build the donor’s chatbot now","Map the intake journey, interview users safely and compare a plain-language form redesign against an AI option","Buy the most expensive LLM available"],"good":1,"why":"A donor preference does not prove the technology solves the actual bottleneck. Start with user needs, constraints and measurable baseline.","coach":"Define queue, completion and response metrics, identify rework causes and test a small non-AI intervention first.","standard":"An evidence-led problem statement identifies who struggles, when and why, supported by the synthetic baseline and targeted research.","writing":"Write a problem statement and two hypotheses: one rule-based/non-AI, one optional AI-assisted.","checklist":["User need is primary","Non-AI alternative considered","Baseline measurable"]},{"title":"Specify an ethical MVP","objective":"Build useful guidance without providing unreviewed legal advice","prompt":"Which first release is safest?","options":["A chatbot that promises definitive eligibility","A mobile-friendly checklist with plain language, optional human help, and no automated legal decision","An inaccessible 22-question form with compulsory email"],"good":1,"why":"Safe service design prioritises clarity, accessible contact routes and a meaningful human fallback.","coach":"Consider privacy minimisation, plain language, digital exclusion, routing uncertainty and consent.","standard":"A small prototype can provide procedural information, detect missing answers locally and route uncertain or urgent cases to a human.","writing":"Sketch a four-screen journey: welcome, intake checklist, review, and human escalation.","checklist":["No unreviewed eligibility verdict","Accessible non-digital option","Minimal data collection"]},{"title":"Design a test suite","objective":"Measure performance and harms, not visual polish alone","prompt":"What best demonstrates the prototype is ready for a supervised pilot?","options":["Five friendly comments from colleagues","Ten documented synthetic test cases including failure, accessibility, uncertainty and escalation cases","An attractive home page screenshot"],"good":1,"why":"A credible release gate tests adverse scenarios as well as usability, with documentation of defects and actions.","coach":"Measure reduction in missing documents; verify no incorrect legal declarations; test low bandwidth, keyboard access and language support.","standard":"Produce tests with expected result, actual result, pass/fail, severity, owner, correction and retest evidence.","writing":"Write ten synthetic acceptance tests; include at least two high-harm stop conditions.","checklist":["10 reproducible cases","Negative and accessibility tests","Clear stop criteria"]},{"title":"Pitch for responsible adoption","objective":"Communicate benefits and limits honestly","prompt":"What makes a fundable proposal?","options":["Maximum automation and no mention of limitations","Validated problem, comparison with non-AI options, working prototype, risk controls, test results and supervised pilot plan","A claim that the AI tool will replace all advisers"],"good":1,"why":"Evidence, user outcomes and accountable governance make a stronger case than technology hype.","coach":"Use baseline, intervention, measured change, costs, risks and stakeholder responsibilities.","standard":"Present a 6-slide pitch: problem, users/evidence, solution, demo, safety/testing, budget/pilot decision.","writing":"Prepare a 200-word pitch and a go/no-go recommendation with pilot metrics.","checklist":["Evidence-led outcome claims","Human accountability","Specific pilot success criteria"]}]}]};

(()=>{'use strict';
const D=window.LEGAL_CLINIC,ms=D.matters,app=document.querySelector('#clinic-app'),SKEY='bsoe_legal_clinic_v2';
let state=read(),activeId=new URLSearchParams(location.search).get('case')||ms[0].id,activeStep=0,activeExhibit=0,playTimer=null,coachVisible=false,modelVisible=false,tutorText='';
if(!ms.some(m=>m.id===activeId))activeId=ms[0].id;
function read(){try{let s=JSON.parse(localStorage.getItem(SKEY));return s&&s.version===2?s:{version:2,choices:{},drafts:{}}}catch(e){return {version:2,choices:{},drafts:{}}}}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(state));return true}catch(e){return false}}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function key(m,i){return m.id+':'+i}function done(m,i){const k=key(m,i);return Number.isInteger(state.choices[k])&&String(state.drafts[k]||'').trim().length>=80}
function countDone(m){return m.phases.filter((p,i)=>done(m,i)).length}
function totalDone(){return ms.reduce((n,m)=>n+countDone(m),0)}
function score(m){return m.phases.reduce((v,p,i)=>v+(state.choices[key(m,i)]===p.good?1:0),0)}
function getMatter(){return ms.find(m=>m.id===activeId)||ms[0]}
function progress(m){return Math.round(100*countDone(m)/m.phases.length)}
function stop(){if(playTimer){clearInterval(playTimer);playTimer=null}}
function select(id){stop();activeId=id;activeStep=0;activeExhibit=0;coachVisible=false;modelVisible=false;tutorText='';if(/^https?:$/.test(location.protocol)){try{let u=new URL(location.href);u.searchParams.set('case',id);history.replaceState(null,'',u.pathname+u.search+u.hash)}catch(e){/* navigation still works without a clean URL */}}render();window.scrollTo({top:0,behavior:'instant'})}
function selectStep(n){stop();activeStep=Math.max(0,Math.min(3,n));coachVisible=false;modelVisible=false;tutorText='';renderMain();}
function render(){const m=getMatter();const total=ms.reduce((n,x)=>n+x.phases.length,0);app.innerHTML=`<section class="clinic-hero"><div><div class="eyebrow">Advanced practice pathway · Version 2</div><h1>Work the case. <span class="accent">Defend the decision.</span></h1><p class="lead">Six complete fictional legal matters with real professional sources, evidence packs, original interactive animations, defensible decisions and a written portfolio. Do the work of a legal technology team—not just a multiple-choice quiz.</p><div class="hero-actions"><a class="btn primary" href="#current-case">Enter case clinic →</a><a class="btn secondary" href="workbook.html">Original workbook ↗</a><a class="btn secondary" href="capstone.html">Build capstone prototype ↗</a></div></div><aside class="clinic-billboard"><span class="clinic-pill">Private, browser-based exercises</span><div class="clinic-metrics"><div><strong>6</strong><span>Full legal matters</span></div><div><strong>24 + 24</strong><span>Exhibits / decision gates</span></div><div><strong>${totalDone()}/${total}</strong><span>Written stages completed</span></div></div><div class="clinic-note">All clients, organisations, facts, documents and data within the scenarios are invented. Official source links are real. No client files or personal details are needed.</div><div class="case-actionrow"><button id="clinic-export-md">Export portfolio (.md)</button><button id="clinic-export-json">Backup (.json)</button><button id="clinic-import">Import backup</button><input class="sr-only" id="clinic-import-file" type="file" accept=".json,application/json" aria-label="Import clinic backup"></div><div id="clinic-status" class="case-status" aria-live="polite">Autosaved locally where your browser permits. Export frequently.</div></aside></section>
<div class="case-layout" id="current-case"><aside class="case-sidebar"><div class="case-sidebar-top"><h3>Choose a case</h3><p class="muted small">Complete each stage: decide, explain and document.</p></div>${ms.map(x=>`<button class="case-navbtn ${x.id===activeId?'active':''}" data-matter="${x.id}"><span class="smalltag">CASE ${x.number} · ${countDone(x)}/4 COMPLETE</span>${esc(x.title)}<span class="subtag">${esc(x.jurisdiction)}</span></button>`).join('')}<a class="btn slim secondary" style="margin-top:10px" href="index.html">← All 11 teaching units</a></aside><div id="case-content" class="case-panel"></div></div><div class="clinic-footer">© 2026 British School of Outdoor Education · Independent education, not legal advice or practice authorisation. The institution is not affiliated with the sources linked. First published 12 November 2026; verify laws before practical use.</div>`;
 document.querySelectorAll('[data-matter]').forEach(b=>b.onclick=()=>select(b.dataset.matter));document.querySelector('#clinic-export-md').onclick=()=>download('legal-clinic-portfolio.md',reportMarkdown(),'text/markdown;charset=utf-8');document.querySelector('#clinic-export-json').onclick=()=>download('legal-clinic-backup.json',JSON.stringify(state,null,2),'application/json');document.querySelector('#clinic-import').onclick=()=>document.querySelector('#clinic-import-file').click();document.querySelector('#clinic-import-file').onchange=importBackup;renderMain();}
function renderMain(){const m=getMatter(),p=m.phases[activeStep],k=key(m,activeStep),chosen=state.choices[k],draft=state.drafts[k]||'';
 document.querySelector('#case-content').innerHTML=`<div class="case-head"><div><span class="case-badge">CASE ${m.number} · ${esc(m.tag)}</span><h2>${esc(m.title)}</h2><p class="case-intro">${esc(m.desc)}</p></div><div><span class="tag">${esc(m.time)}</span><br><span class="tag">${esc(m.jurisdiction)}</span></div></div><div class="case-prog-track" aria-label="Case progress"><div style="width:${progress(m)}%"></div></div><p class="case-status">${countDone(m)} of 4 stages complete · Decision checks ${score(m)}/4 · Answers are formative, not professional grading.</p>
<section class="case-section"><h3>Client brief & learning objectives</h3><p>${esc(m.brief)}</p><ul class="case-outcomes">${m.outcomes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>
<section class="case-section"><div class="case-head"><h3>Evidence pack · four exhibits</h3><span class="case-badge">Synthetic teaching documents</span></div><div class="case-document-row">${m.exhibits.map((x,i)=>`<button class="case-docbtn" data-ex="${i}" aria-pressed="${i===activeExhibit}"><strong>${esc(x.title)}</strong><small>${esc(x.type)}</small></button>`).join('')}</div><div class="case-docbody" id="case-document" role="region" aria-label="Selected exhibit">${esc(m.exhibits[activeExhibit].body)}</div></section>
<section class="case-section"><h3>Original process animation</h3><p class="small muted">This is an interactive educational diagram, not footage or a recording of a practising lawyer. Follow the decision pathway and identify the human authorisation gate.</p><div class="motion-board"><div class="motion-flow">${m.phases.map((x,i)=>`<button class="motion-node ${i===activeStep?'active':''} ${done(m,i)?'complete':''}" data-stage="${i}" aria-label="Open stage ${i+1}: ${esc(x.title)}"><em>STAGE ${i+1}</em>${esc(x.title)}</button>`).join('')}</div><div class="motion-controller"><div class="motion-description" id="motion-narration">${esc(p.objective)}</div><button id="motion-play">▶ Play workflow</button></div></div><p class="case-source-warning">For related expert content: <a href="https://www.youtube.com/watch?v=${encodeURIComponent(m.video)}" target="_blank" rel="noopener noreferrer">${esc(m.videoTitle)} ↗</a>. Third-party video opens only when selected; it is not produced by BSOE.</p></section>
<section class="case-section" id="stage-work"><div class="case-head"><h3>Decision studio · Stage ${activeStep+1}</h3><span class="case-badge">Human reasoning required</span></div><div class="stage-tabbar">${m.phases.map((x,i)=>`<button data-stage="${i}" class="${i===activeStep?'active':''} ${done(m,i)?'done':''}">${i+1}. ${esc(x.title)}</button>`).join('')}</div><h3>${esc(p.title)}</h3><div class="stage-objective"><strong>Goal:</strong> ${esc(p.objective)}</div><h4>${esc(p.prompt)}</h4><div role="radiogroup" aria-label="Select the defensible decision">${p.options.map((x,i)=>`<label class="case-choice ${chosen===i?'chosen':''}"><input type="radio" name="case-decision" value="${i}" ${chosen===i?'checked':''}>${esc(x)}</label>`).join('')}</div>${Number.isInteger(chosen)?`<div class="case-feedback ${chosen===p.good?'':'risk'}"><strong>${chosen===p.good?'Sound initial decision':'Reconsider the decision'}</strong><div>${esc(p.why)}</div><p class="small" style="margin:6px 0 0">The decision check measures a starting safeguard; the written reasoning still needs assessor review.</p></div>`:'<p class="small muted">Choose a route to receive immediate, explanatory feedback.</p>'}
<div class="case-section" style="padding-bottom:0"><h4>Professional work product</h4><p>${esc(p.writing)}</p><label for="case-draft" class="sr-only">Your written work product</label><textarea id="case-draft" class="case-write" placeholder="Draft your reasoning, source evidence, uncertainties and the accountable reviewer. Do not enter real client information.">${esc(draft)}</textarea><div class="case-wordcount"><span id="case-chars">${draft.trim().length}</span> characters · 80-character minimum for the practice completion counter · autosaves locally</div><div class="case-actionrow"><button id="case-coach">${coachVisible?'Hide':'Show'} guided coach</button><button id="case-model">${modelVisible?'Hide':'Review'} worked approach</button></div>${coachVisible?`<div class="case-coach"><strong>Guided coach (offline, not generative AI)</strong><p>${esc(p.coach)}</p></div>`:''}${modelVisible?`<div class="case-model"><strong>Model review points — one defensible approach, not legal advice</strong><p>${esc(p.standard)}</p><ul class="case-checks">${p.checklist.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}
</div><div class="case-actions"><button id="case-prev" ${activeStep===0?'disabled':''}>← Previous</button><button id="case-next" class="primary">${activeStep===3?'Review case portfolio →':'Next decision →'}</button><button id="case-print">Print</button></div></section>
<section class="case-section"><h3>Ask the learning tutor</h3><p class="small muted">You can ask a process question without sharing your answers or case text. With no configured Azure endpoint, this gives curated guidance only. If Azure is configured, only your typed question and mapped module ID are sent to that service.</p><div class="case-tutor-send"><textarea id="case-tutor-input" maxlength="1200" placeholder="e.g. What evidence would establish this? (No personal or real client details)"></textarea><button id="case-tutor-send">Get guidance →</button></div>${tutorText?`<div class="case-tutor-answer" id="case-tutor-answer" aria-live="polite">${esc(tutorText)}</div>`:'<div class="case-tutor-answer" id="case-tutor-answer" aria-live="polite" hidden></div>'}</section>
<section class="case-section"><h3>Official sources and further research</h3><p class="small muted">Read the original official source. Never treat the training scenario, tutorial or an AI answer as legal authority. Check jurisdiction, currency and later amendments.</p><div class="source-row">${m.sources.map(s=>`<a target="_blank" rel="noopener noreferrer" href="${esc(s[1])}">${esc(s[0])} ↗</a>`).join('')}</div></section>`;
 document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{activeExhibit=+b.dataset.ex;document.querySelectorAll('[data-ex]').forEach(z=>z.setAttribute('aria-pressed',String(z===b)));document.querySelector('#case-document').textContent=m.exhibits[activeExhibit].body});
 document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>selectStep(+b.dataset.stage));
 const playbtn=document.querySelector('#motion-play');playbtn.onclick=()=>{if(playTimer){stop();playbtn.textContent='▶ Play workflow';return}playbtn.textContent='Ⅱ Pause';let previewStep=activeStep;let f=()=>{previewStep=(previewStep+1)%4;document.querySelectorAll('.motion-node').forEach((n,i)=>{n.classList.toggle('active',i===previewStep)});document.querySelector('#motion-narration').textContent=m.phases[previewStep].objective};playTimer=setInterval(f,1900)};
 document.querySelectorAll('input[name="case-decision"]').forEach(r=>r.onchange=()=>{state.choices[k]=+r.value;save();stop();render()});
 const textarea=document.querySelector('#case-draft');textarea.oninput=()=>{state.drafts[k]=textarea.value;save();document.querySelector('#case-chars').textContent=textarea.value.trim().length;};
 document.querySelector('#case-coach').onclick=()=>{coachVisible=!coachVisible;renderMain()};document.querySelector('#case-model').onclick=()=>{modelVisible=!modelVisible;renderMain()};
 document.querySelector('#case-prev').onclick=()=>selectStep(activeStep-1);
 document.querySelector('#case-next').onclick=()=>{if(activeStep<3){selectStep(activeStep+1)}else{stop();showSummary(m)}};
 document.querySelector('#case-print').onclick=()=>window.print();document.querySelector('#case-tutor-send').onclick=()=>sendTutor(m,p);
 }
function showSummary(m){let d=m.phases.map((p,i)=>({p,i,k:key(m,i)}));let right=document.querySelector('#case-content');right.innerHTML=`<div class="eyebrow">Portfolio review · Case ${m.number}</div><h2>${esc(m.title)}</h2><p class="case-intro">Your decision-stage feedback is formative. A teacher or assessor must review the substance of the written work, the cited authorities, source ledger and professional judgment.</p><div class="case-summarygrid"><div><strong>${countDone(m)}/4</strong><span>Stages with decision and ≥80 characters of reasoning</span></div><div><strong>${score(m)}/4</strong><span>Safe initial decisions identified</span></div></div>${d.map(({p,i,k})=>`<section class="case-section"><span class="case-badge">STAGE ${i+1}</span><h3>${esc(p.title)}</h3><p class="small">Decision: ${Number.isInteger(state.choices[k])?esc(p.options[state.choices[k]]):'Not yet selected'}</p><div class="case-docbody">${esc(state.drafts[k]||'Not yet written.')}</div><p class="case-status">${done(m,i)?'Written task recorded':'Incomplete: enter a decision and at least 80 characters of reasoning.'}</p></section>`).join('')}<div class="case-actions"><button class="primary" id="summary-return">← Back to case</button><button id="summary-download">Export portfolio (.md)</button></div><div class="case-info" style="margin-top:15px">A complete practice record does not establish legal competence or justify a qualification on its own. The assessor must review accuracy, judgement, citations, professional boundaries and any required oral defence.</div>`;document.querySelector('#summary-return').onclick=()=>selectStep(3);document.querySelector('#summary-download').onclick=()=>download('legal-clinic-portfolio.md',reportMarkdown(),'text/markdown;charset=utf-8');right.scrollIntoView({behavior:'smooth',block:'start'})}
async function sendTutor(m,p){const i=document.querySelector('#case-tutor-input'),q=i.value.trim().slice(0,1200),a=document.querySelector('#case-tutor-answer');if(!q){a.hidden=false;a.textContent='Type a question first. Do not paste confidential information.';return}const ep=window.LEGAL_TUTOR_CONFIG?.endpoint||'';a.hidden=false;if(!ep){a.textContent='Guided tutor · Offline response (not generative AI):\n\n'+p.coach+'\n\nCheck your conclusion against this question: What source supports the decision, which fact remains unproven, and which qualified human is accountable for the final output?';return}a.textContent='Contacting the configured Azure tutor…';try{let res=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({module:m.module,question:q})});if(!res.ok)throw Error('Tutor service returned '+res.status);let j=await res.json();a.textContent=typeof j.answer==='string'?j.answer:'No response was returned.'}catch(e){a.textContent='Azure is unavailable; offline guided fallback:\n'+p.coach+'\n(Service message: '+e.message+')'}}
function reportMarkdown(){let s=['# Legal Systems Lab — Advanced Practice Clinic Portfolio','',`Exported ${new Date().toISOString().slice(0,10)}.`, '**All scenarios are fictional; only external official sources describe real law.**','', 'No credit, legal qualification or professional approval is awarded by this browser export.',''];ms.forEach(m=>{s.push('## '+m.number+' — '+m.title,'',m.desc,'',`Formative decisions correct: ${score(m)}/4; completed written stages: ${countDone(m)}/4.`,'');m.phases.forEach((p,i)=>{let k=key(m,i),ch=state.choices[k];s.push('### Stage '+(i+1)+' — '+p.title,'', '**Decision:** '+(Number.isInteger(ch)?p.options[ch]:'Not answered'),'', '**Work product:**','',state.drafts[k]||'(No response)','')});s.push('**Sources to check:**',...m.sources.map(x=>'- '+x[0]+': '+x[1]),'')});return s.join('\n')}
function download(name,body,type){let blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);let status=document.querySelector('#clinic-status');if(status)status.textContent='Export started. Check your Downloads folder and keep the backup safe.'}
async function importBackup(e){let f=e.target.files?.[0];if(!f)return;let status=document.querySelector('#clinic-status');try{let o=JSON.parse(await f.text());if(o.version!==2||typeof o.choices!=='object'||typeof o.drafts!=='object'||!o.choices||!o.drafts)throw Error('Unrecognised clinic format.');let valid=new Set(ms.flatMap(m=>m.phases.map((p,i)=>key(m,i))));let choices={},drafts={};for(const [k,v] of Object.entries(o.choices)){if(valid.has(k)&&Number.isInteger(v)&&v>=0&&v<3)choices[k]=v}for(const [k,v] of Object.entries(o.drafts)){if(valid.has(k)&&typeof v==='string')drafts[k]=v.slice(0,40000)}if(!confirm('This will replace the current local clinic responses with the imported backup. Continue?'))return;state={version:2,choices,drafts};save();render()}catch(err){if(status)status.textContent='Import failed: '+err.message}finally{e.target.value=''}}
window.addEventListener('beforeunload',stop);render();
})();

</script></body></html>
