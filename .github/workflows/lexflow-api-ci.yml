name: LexFlow NG backend validation
on:
  push:
    branches: [production-foundation]
    paths:
      - 'lexflow-ng/backend/**'
      - '.github/workflows/lexflow-api-ci.yml'
  pull_request:
    paths:
      - 'lexflow-ng/backend/**'
      - '.github/workflows/lexflow-api-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    name: Node 22 lint and security tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lexflow-ng/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
