name: LexFlow CPD Azure endpoint verification (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check recorded development API probes
        env:
          BASE_URL: https://lexflowcpd-api.calmdune-686822d1.westeurope.azurecontainerapps.io
        shell: bash
        run: |
          set -euo pipefail
          for path in healthz readyz; do
            echo "Checking /$path"
            code="$(curl --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 40 -sS -o /dev/null -w '%{http_code}' "$BASE_URL/$path")"
            echo "/$path => HTTP $code" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" != "200" ]; then exit 1; fi
          done
          code="$(curl --connect-timeout 15 --max-time 25 -sS -o /dev/null -w '%{http_code}' "$BASE_URL/api/me")"
          echo "/api/me without credentials => HTTP $code" >> "$GITHUB_STEP_SUMMARY"
          test "$code" = "401"
          echo "These probes demonstrate reachability and an unauthenticated denial only." >> "$GITHUB_STEP_SUMMARY"
          echo "They do not establish user provisioning, secure DB role grants, certificate issuance or NBA-ICLE accreditation." >> "$GITHUB_STEP_SUMMARY"
