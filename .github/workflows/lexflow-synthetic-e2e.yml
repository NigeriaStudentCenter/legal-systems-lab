name: LexFlow synthetic browser-to-API E2E
on:
  push:
    branches: [client-portal-phase2]
    paths:
      - 'lexflow-ng/backend/**'
      - 'lexflow-ng/portal/**'
      - '.github/workflows/lexflow-synthetic-e2e.yml'
  pull_request:
    paths:
      - 'lexflow-ng/backend/**'
      - 'lexflow-ng/portal/**'
      - '.github/workflows/lexflow-synthetic-e2e.yml'
permissions:
  contents: read
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lexflow_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lexflow_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      LEXFLOW_E2E_SANDBOX: 'YES'
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lexflow_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend test dependencies
        working-directory: lexflow-ng/backend
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check E2E script syntax
        working-directory: lexflow-ng/backend
        run: node --check e2e/portal.browser.test.mjs
      - name: Install Chromium for isolated browser test
        working-directory: lexflow-ng/backend
        run: npx playwright install --with-deps chromium
      - name: Run synthetic real API and PostgreSQL journey
        working-directory: lexflow-ng/backend
        run: npm run test:e2e
      - name: Assert service settings stay closed in deployed staging
        run: |
          grep -q "ENABLE_ENGAGEMENTS', value: 'false'" lexflow-ng/infra/staging-hybrid.bicep
          grep -q "enabled: false" lexflow-ng/portal/config.js
