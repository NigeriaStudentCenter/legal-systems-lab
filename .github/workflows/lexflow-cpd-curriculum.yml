name: LexFlow CPD curriculum checks
on:
  push:
    branches: [main]
    paths:
      - lexflow-cpd/academy*.js
      - lexflow-cpd/readiness*
      - lexflow-cpd/monitoring.html
      - lexflow-cpd/accreditation/**
      - lexflow-cpd/PHASE12-QA-REVIEW-DOSSIER.md
      - lexflow-cpd/VIDEO-PRODUCTION-TRACKER.md
      - lexflow-cpd/compliance.html
      - lexflow-cpd/case-*.js
      - lexflow-cpd/guided-investigations*
      - lexflow-cpd/capstone*
      - lexflow-cpd/instructor-guide*
      - lexflow-cpd/INSTRUCTOR-DELIVERY-PACK.md
      - lexflow-cpd/backend/tutor-curriculum.mjs
      - lexflow-cpd/backend/tutor-investigations.mjs
      - lexflow-cpd/academy*.html
      - lexflow-cpd/case-*.html
      - lexflow-cpd/course.html
      - lexflow-cpd/index.html
      - lexflow-cpd/portal.html
      - lexflow-cpd/auth.js
      - lexflow-cpd/staff.html
      - lexflow-cpd/staff.js
      - .github/workflows/lexflow-cpd-curriculum.yml
  pull_request:
    paths:
      - lexflow-cpd/academy*.js
      - lexflow-cpd/readiness*
      - lexflow-cpd/monitoring.html
      - lexflow-cpd/accreditation/**
      - lexflow-cpd/PHASE12-QA-REVIEW-DOSSIER.md
      - lexflow-cpd/VIDEO-PRODUCTION-TRACKER.md
      - lexflow-cpd/compliance.html
      - lexflow-cpd/case-*.js
      - lexflow-cpd/guided-investigations*
      - lexflow-cpd/capstone*
      - lexflow-cpd/instructor-guide*
      - lexflow-cpd/INSTRUCTOR-DELIVERY-PACK.md
      - lexflow-cpd/backend/tutor-curriculum.mjs
      - lexflow-cpd/academy*.html
      - lexflow-cpd/case-*.html
      - lexflow-cpd/course.html
      - lexflow-cpd/index.html
      - .github/workflows/lexflow-cpd-curriculum.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          for file in lexflow-cpd/academy*.js lexflow-cpd/case-*.js lexflow-cpd/guided-investigations*.js lexflow-cpd/capstone*.js lexflow-cpd/instructor-guide.js lexflow-cpd/auth.js lexflow-cpd/staff.js lexflow-cpd/backend/tutor-*.mjs; do node --check "$file"; done
      - name: Curriculum and links
        run: node lexflow-cpd/academy-check.mjs
      - name: Readiness assessment and NBA Secretariat HTML review
        run: node lexflow-cpd/readiness-check.mjs
      - name: Accreditation application pack accuracy and completeness
        run: node lexflow-cpd/accreditation/check-pack.mjs
      - name: NBA-ICLE six-requested-annex response pack
        run: node lexflow-cpd/accreditation/course-approval/check-response.mjs
