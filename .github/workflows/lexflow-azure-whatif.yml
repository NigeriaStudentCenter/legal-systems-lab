name: LexFlow Azure staging plan (no deployment)
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  azure-plan:
    if: ${{ vars.LEXFLOW_AZURE_PLAN_ENABLED == 'true' }}
    environment: lexflow-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-foundation
      - name: Azure identity federation
        uses: azure/login@v2
        with:
          client-id: ${{ vars.LEXFLOW_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.LEXFLOW_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.LEXFLOW_AZURE_SUBSCRIPTION_ID }}
      - name: Evaluate staging changes only
        shell: bash
        env:
          PG_PASSWORD: ${{ secrets.LEXFLOW_STAGING_PG_ADMIN_PASSWORD }}
          RESOURCE_GROUP: ${{ vars.LEXFLOW_STAGING_RESOURCE_GROUP }}
          PREFIX: ${{ vars.LEXFLOW_STAGING_PREFIX }}
          PG_ADMIN: ${{ vars.LEXFLOW_STAGING_PG_ADMIN }}
        run: |
          set -euo pipefail
          test -n "$PG_PASSWORD"
          test -n "$RESOURCE_GROUP"
          test -n "$PREFIX"
          test -n "$PG_ADMIN"
          az bicep build --file lexflow-ng/infra/bootstrap.bicep --outfile /tmp/lexflow-staging-arm.json
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file /tmp/lexflow-staging-arm.json \
            --parameters prefix="$PREFIX" postgresAdmin="$PG_ADMIN" postgresAdminPassword="$PG_PASSWORD" \
            --result-format ResourceIdOnly
      - name: Note
        run: echo "No Azure resources were created by this plan-only workflow."
