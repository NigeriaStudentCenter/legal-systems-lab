name: LexFlow CPD API image (test and build only, no deployment)
on:
  push:
    branches: [main]
    paths:
      - lexflow-cpd/backend/**
      - lexflow-cpd/academy-content.js
      - lexflow-cpd/case-dossiers.js
      - lexflow-cpd/guided-investigations-content.js
      - lexflow-cpd/capstone-content.js
      - .github/workflows/lexflow-cpd-api-image.yml
  pull_request:
    paths:
      - lexflow-cpd/backend/**
      - lexflow-cpd/academy-content.js
      - lexflow-cpd/case-dossiers.js
      - lexflow-cpd/guided-investigations-content.js
      - lexflow-cpd/capstone-content.js
      - .github/workflows/lexflow-cpd-api-image.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: lexflow-cpd/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26 # same major version as the runtime image
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Syntax check all Azure release scripts
        run: |
          bash -n ../infra/check-phase8-azure.sh
          bash -n ../infra/release-phase8.sh
          bash -n ../infra/test-phase8-release.sh
      - name: Rehearse Azure release safety gates using offline CLI mock
        run: bash ../infra/test-phase8-release.sh
      - name: Validate course-grounded AI tutor policy and lesson alignment
        run: node --test test/tutor-curriculum.test.mjs
      - name: Validate bounded case tutor stages and capstone contracts
        run: node --test test/case-investigations.test.mjs test/capstone-policy.test.mjs
      - name: No known high or critical vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
        env:
          TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
  image:
    needs: test
    # Pull requests are tested only; images are built from main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build locally for scanning
        uses: docker/build-push-action@v7
        with:
          context: lexflow-cpd/backend
          load: true
          push: false
          provenance: false
          tags: lexflow-cpd-api:scan
      - name: Refuse to publish an image with fixable high or critical vulnerabilities
        # Pinned to the signed commit of release v0.36.0: this action's tags were re-created in
        # March 2026, so a tag alone is not a trustworthy reference.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lexflow-cpd-api:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: lexflow-cpd/backend
          push: true
          provenance: false
          tags: |
            ghcr.io/nigeriastudentcenter/lexflow-cpd-api:dev
            ghcr.io/nigeriastudentcenter/lexflow-cpd-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/NigeriaStudentCenter/legal-systems-lab
            org.opencontainers.image.description=LexFlow CPD API (development, fictional data only)
      - name: Immutable reference for deployment
        run: echo "ghcr.io/nigeriastudentcenter/lexflow-cpd-api@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
