name: LexFlow CPD API image (test and build only, no deployment)
on:
  push:
    branches: [main]
    paths:
      - lexflow-cpd/backend/**
      - .github/workflows/lexflow-cpd-api-image.yml
  pull_request:
    paths:
      - lexflow-cpd/backend/**
      - .github/workflows/lexflow-cpd-api-image.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: lexflow-cpd/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: No known high or critical vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
        env:
          TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
  image:
    needs: test
    # Pull requests are tested only; images are built from main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: lexflow-cpd/backend
          load: true
          push: false
          provenance: false
          tags: lexflow-cpd-api:scan
      - name: Refuse to publish an image with fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lexflow-cpd-api:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: lexflow-cpd/backend
          push: true
          provenance: false
          tags: |
            ghcr.io/nigeriastudentcenter/lexflow-cpd-api:dev
            ghcr.io/nigeriastudentcenter/lexflow-cpd-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/NigeriaStudentCenter/legal-systems-lab
            org.opencontainers.image.description=LexFlow CPD API (development, fictional data only)
      - name: Immutable reference for deployment
        run: echo "ghcr.io/nigeriastudentcenter/lexflow-cpd-api@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
