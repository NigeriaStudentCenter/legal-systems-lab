name: LexFlow API staging image (build only, no deployment)
on:
  push:
    branches: [azure-staging-hybrid]
    paths:
      - lexflow-ng/backend/**
      - .github/workflows/lexflow-api-image.yml
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: lexflow-ng/backend
          push: true
          provenance: false
          tags: |
            ghcr.io/nigeriastudentcenter/lexflow-ng-api:staging
            ghcr.io/nigeriastudentcenter/lexflow-ng-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/NigeriaStudentCenter/legal-systems-lab
            org.opencontainers.image.description=LexFlow NG API (staging, synthetic data only)
      - name: Immutable reference for deployment
        run: echo "ghcr.io/nigeriastudentcenter/lexflow-ng-api@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
